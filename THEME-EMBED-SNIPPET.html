<!--
  ============================================================================
  EARTHBOUND INC. QUOTE FORM - PageFly embed + GA4 bridge
  ============================================================================
  Where this goes
  ---------------
  /pages/get-quoted is a PageFly page, not a plain Shopify page. Its body_html
  is empty; the Typeform lives in a PageFly "Custom HTML" element inside section
  pf-e9b6, and today that element holds exactly this:

      <div data-tf-live="01HGCPQC1G9Q95TN680B18176V"></div>
      <script src="//embed.typeform.com/next/embed.js"></script>

  The cutover is replacing the contents of that one element with part 1 below,
  in the PageFly editor. Nothing in the Shopify theme has to change.

  Height
  ------
  The form is 100vh internally, so it fills whatever frame it is given. 820px
  suits the 50/50 desktop split; the media query drops it on phones where the
  photo is hidden and the questions stack.

  GA4
  ---
  Earthbound has no Google Ads account on this store and no GTM. GA4
  G-6LQZ1RYQXF runs through Shopify's Google channel web pixel, which lives in
  the web-pixels-manager sandbox, so there is NO `gtag` on window for a page
  script to call. Part 2 therefore loads its own gtag for the same property with
  send_page_view:false, so it reports the lead without double counting the
  pageviews the Shopify pixel already sends.

  Part 2 is optional. The form emails the lead either way; this only adds the
  GA4 event. Leave it out and nothing about the lead breaks.
  ============================================================================
-->

<!-- 1) EMBED: the whole contents of the PageFly Custom HTML element -->
<div id="eb-quote" style="max-width:1240px;margin:0 auto;">
  <iframe
    src="https://earthbound-quote-request.netlify.app/"
    title="Earthbound Inc. quote request"
    style="width:100%;height:820px;border:none;display:block;background:#F3F3F0;"
    loading="lazy"></iframe>
</div>
<style>
  @media (max-width: 860px) {
    #eb-quote iframe { height: 680px; }
  }
</style>

<!-- 2) OPTIONAL GA4 BRIDGE: same element, or once before </body> -->
<script>
  (function () {
    var GA4 = 'G-6LQZ1RYQXF';
    var loaded = false;

    // Load gtag only when a lead actually lands, so a visitor who never submits
    // pays nothing for it.
    function loadGtag(cb) {
      if (loaded) return cb();
      loaded = true;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA4;
      s.onload = function () {
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        // send_page_view:false, because Shopify's own pixel already counts those.
        window.gtag('config', GA4, { send_page_view: false });
        cb();
      };
      document.head.appendChild(s);
    }

    window.addEventListener('message', function (e) {
      // The form is on netlify.app and the page is on earthboundinc.com, so the
      // origin check is what keeps any other frame from faking a lead.
      if (e.origin !== 'https://earthbound-quote-request.netlify.app') return;
      var d = e.data || {};
      if (d.event !== 'obgform_submission') return;

      loadGtag(function () {
        window.gtag('event', 'generate_lead', {
          value: Number(d.conversion_value) || 0,
          currency: 'USD',
          decoration_method: d.decoration_method || '',
          source: d.source || '',
        });
      });
    });
  })();
</script>
